<text x="320" y="85" font-size="22" text-anchor="middle" fill="#302e2a" font-weight="bold">B 向外且增大；Eᵢ 顺时针</text>
<path d="M 320 275 L 450 275" fill="none" stroke="#2569a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="467" y="306" font-size="22" text-anchor="middle" fill="#2569a3" font-weight="normal">R</text>
<text x="535" y="268" font-size="22" text-anchor="middle" fill="#bc493d" font-weight="bold">Eᵢ</text>
<text x="320" y="488" font-size="22" text-anchor="middle" fill="#302e2a" font-weight="normal">r ≤ R：|Eᵢ| = (r / 2) |dB / dt|</text>
<text x="320" y="534" font-size="22" text-anchor="middle" fill="#302e2a" font-weight="normal">r &gt; R：|Eᵢ| = (R² / 2r) |dB / dt|</text>
<text x="320" y="582" font-size="22" text-anchor="middle" fill="#302e2a" font-weight="bold">外部 B ≈ 0，Eᵢ 仍可不为零</text>
<text x="24" y="630" font-size="18" text-anchor="start" fill="#77736c" font-weight="normal">蓝色圆域是磁场区域；红色圆是感生电场线。</text>
