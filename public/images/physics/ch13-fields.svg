<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" role="img" aria-labelledby="title desc" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<title id="title">B、H、M：先把单位统一再相加</title><desc id="desc">B、H、M：先把单位统一再相加</desc>
<rect width="640" height="470" rx="14" fill="#fffdf7"/>
<text x="24" y="36" font-size="23" text-anchor="start" fill="#302e2a" font-weight="bold">B、H、M：先把单位统一再相加</text>
<text x="320" y="84" font-size="28" text-anchor="middle" fill="#302e2a" font-weight="bold">B / μ₀ = H + M</text>
<text x="35" y="126" font-size="22" text-anchor="start" fill="#77736c" font-weight="normal">示例：线性顺磁质，三个矢量同向</text>
<defs><marker id="a2569a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2569a3"/></marker></defs>
<path d="M 100 185 L 360 185" fill="none" stroke="#2569a3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a2569a3)"/>
<text x="230" y="171" font-size="22" text-anchor="middle" fill="#2569a3" font-weight="bold">H</text>
<defs><marker id="abc493d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bc493d"/></marker></defs>
<path d="M 360 185 L 470 185" fill="none" stroke="#bc493d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#abc493d)"/>
<text x="415" y="171" font-size="22" text-anchor="middle" fill="#bc493d" font-weight="bold">M</text>
<path d="M 100 205 L 100 275" fill="none" stroke="#77736c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/>
<path d="M 470 205 L 470 275" fill="none" stroke="#77736c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/>
<defs><marker id="a7652a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7652a4"/></marker></defs>
<path d="M 100 285 L 470 285" fill="none" stroke="#7652a4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a7652a4)"/>
<text x="285" y="322" font-size="22" text-anchor="middle" fill="#7652a4" font-weight="bold">B / μ₀</text>
<text x="320" y="380" font-size="22" text-anchor="middle" fill="#302e2a" font-weight="normal">H、M、B / μ₀ 的单位均为 A/m</text>
<text x="320" y="418" font-size="22" text-anchor="middle" fill="#302e2a" font-weight="bold">决定磁力的场量仍是 B</text>
<text x="24" y="450" font-size="18" text-anchor="start" fill="#77736c" font-weight="normal">箭头示意矢量合成；不表示真实材料的比例。</text>
</svg>
