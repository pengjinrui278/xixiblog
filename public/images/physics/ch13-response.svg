<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" role="img" aria-labelledby="title desc" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<title id="title">顺磁与抗磁：先比较磁化方向</title><desc id="desc">顺磁与抗磁：先比较磁化方向</desc>
<rect width="640" height="520" rx="14" fill="#fffdf7"/>
<text x="24" y="36" font-size="23" text-anchor="start" fill="#302e2a" font-weight="bold">顺磁与抗磁：先比较磁化方向</text>
<text x="38" y="82" font-size="22" text-anchor="start" fill="#77736c" font-weight="normal">相同的局部 H，取向右为正</text>
<rect x="28" y="112" width="584" height="165" rx="12" fill="#eee8dc" stroke="none" stroke-width="2"/>
<text x="50" y="145" font-size="22" text-anchor="start" fill="#302e2a" font-weight="bold">顺磁质：χₘ &gt; 0</text>
<defs><marker id="a2569a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2569a3"/></marker></defs>
<path d="M 170 185 L 430 185" fill="none" stroke="#2569a3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a2569a3)"/>
<text x="475" y="193" font-size="22" text-anchor="middle" fill="#2569a3" font-weight="bold">H</text>
<defs><marker id="abc493d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bc493d"/></marker></defs>
<path d="M 170 235 L 265 235" fill="none" stroke="#bc493d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#abc493d)"/>
<text x="310" y="243" font-size="22" text-anchor="middle" fill="#bc493d" font-weight="bold">M</text>
<text x="420" y="243" font-size="22" text-anchor="middle" fill="#bc493d" font-weight="normal">同向</text>
<rect x="28" y="292" width="584" height="165" rx="12" fill="#eee8dc" stroke="none" stroke-width="2"/>
<text x="50" y="325" font-size="22" text-anchor="start" fill="#302e2a" font-weight="bold">抗磁质：χₘ &lt; 0</text>
<path d="M 170 365 L 430 365" fill="none" stroke="#2569a3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a2569a3)"/>
<text x="475" y="373" font-size="22" text-anchor="middle" fill="#2569a3" font-weight="bold">H</text>
<path d="M 265 415 L 170 415" fill="none" stroke="#bc493d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#abc493d)"/>
<text x="310" y="423" font-size="22" text-anchor="middle" fill="#bc493d" font-weight="bold">M</text>
<text x="420" y="423" font-size="22" text-anchor="middle" fill="#bc493d" font-weight="normal">反向</text>
<text x="24" y="500" font-size="18" text-anchor="start" fill="#77736c" font-weight="normal">M = χₘH；为看清方向，图中磁化响应已放大。</text>
</svg>
