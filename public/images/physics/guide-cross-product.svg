<text x="550" y="227" font-size="22" text-anchor="middle" fill="#b87620" font-weight="bold">v</text>
<path d="M 465 223 L 465 155" fill="none" stroke="#287b64" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a287b64)"/>
<text x="441" y="160" font-size="22" text-anchor="middle" fill="#287b64" font-weight="bold">F</text>
