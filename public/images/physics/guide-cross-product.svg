<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" width="640" height="450" role="img" aria-labelledby="title desc" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<title id="title">叉乘：先判断 v × B，再乘电荷的正负号</title><desc id="desc">叉乘：先判断 v × B，再乘电荷的正负号</desc>
