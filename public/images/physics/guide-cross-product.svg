<text x="24" y="36" font-size="23" text-anchor="start" fill="#302e2a" font-weight="bold">叉乘：先判断 v × B，再乘电荷的正负号</text>
<circle cx="90" cy="140" r="11" fill="#fffdf7" stroke="#7652a4" stroke-width="2"/>
