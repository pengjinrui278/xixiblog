<text x="555" y="578" font-size="22" text-anchor="middle" fill="#302e2a" font-weight="normal">C</text>
<text x="465" y="566" font-size="22" text-anchor="middle" fill="#bc493d" font-weight="normal">+</text>
<text x="465" y="599" font-size="22" text-anchor="middle" fill="#2569a3" font-weight="normal">−</text>
<path d="M 510 580 L 510 655" fill="none" stroke="#302e2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 510 655 L 130 655" fill="none" stroke="#302e2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 130 482 L 130 655" fill="none" stroke="#302e2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<defs><marker id="a2569a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2569a3"/></marker></defs>
<path d="M 470 482 L 395 482" fill="none" stroke="#2569a3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a2569a3)"/>
<text x="420" y="518" font-size="22" text-anchor="middle" fill="#2569a3" font-weight="normal">I放</text>
<text x="320" y="695" font-size="22" text-anchor="middle" fill="#2569a3" font-weight="normal">I放 = −dq / dt；原正极板的 q 减少</text>
<text x="24" y="740" font-size="18" text-anchor="start" fill="#77736c" font-weight="normal">两图分别表示开关完成切换后的完整连接，电容原正极板均在上。</text>
</svg>
