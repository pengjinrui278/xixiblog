<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" width="640" height="760" role="img" aria-labelledby="title desc" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<title id="title">RC 的两种接线：充电与放电</title><desc id="desc">RC 的两种接线：充电与放电</desc>
<rect width="640" height="760" rx="14" fill="#fffdf7"/>
<text x="24" y="36" font-size="23" text-anchor="start" fill="#302e2a" font-weight="bold">RC 的两种接线：充电与放电</text>
<text x="30" y="83" font-size="22" text-anchor="start" fill="#302e2a" font-weight="normal">① 充电：接通电源</text>
<path d="M 130 132 L 255 132" fill="none" stroke="#302e2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 255 132 L 278.0 132.0 L 286.625 140.0 L 295.25 124.0 L 303.875 140.0 L 312.5 124.0 L 321.125 140.0 L 329.75 124.0 L 338.375 140.0 L 347.0 132.0 L 370 132" fill="none" stroke="#302e2a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="310" y="115" font-size="22" text-anchor="middle" fill="#302e2a" font-weight="normal">R</text>
<path d="M 370 132 L 510 132" fill="none" stroke="#302e2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 510 132 L 510 210" fill="none" stroke="#302e2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
